<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin workspace | Aura</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-page">
    <div class="admin-app" id="admin-app">
        <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin navigation">
            <a class="admin-brand" href="admin.html" aria-label="Aura admin home"><span class="admin-brand-mark">A</span><span class="admin-brand-name">Aura<span>.</span><small>ADMIN</small></span></a>
            <div class="admin-nav-label">WORKSPACE</div>
            <nav class="admin-nav">
                <a class="admin-nav-link" href="#dashboard" data-page="dashboard" aria-label="Dashboard">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span>
                </a>
                <a class="admin-nav-link" href="#products" data-page="products" aria-label="Products">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg><span>Products</span>
                </a>
                <a class="admin-nav-link" href="#inventory" data-page="inventory" aria-label="Inventory">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7 12 3l9 4v10l-9 4-9-4V7Z"/><path d="M3 7l9 4 9-4M12 11v10M7.5 5l9 4"/></svg><span>Inventory</span>
                </a>
                <a class="admin-nav-link" href="#orders" data-page="orders" aria-label="Orders">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5z"/><path d="M9 4V2h6v2M8 9h8M8 13h8M8 17h5"/></svg><span>Orders</span><span class="admin-nav-count" id="pending-order-count" hidden></span>
                </a>
                <a class="admin-nav-link" href="#analytics" data-page="analytics" aria-label="Analytics">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 6-7"/></svg><span>Analytics</span>
                </a>
            </nav>
            <div class="admin-sidebar-footer">
                <a class="admin-store-link" href="index.html" aria-label="View storefront">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7M10 14 21 3"/><path d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>
                    <span>View storefront</span>
                </a>
                <button class="admin-logout-button" id="admin-logout" aria-label="Sign out">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"/></svg>
                    <span>Sign out</span>
                </button>
                <div class="admin-account">
                    <span class="admin-avatar" aria-hidden="true">A</span>
                    <span class="admin-account-details"><strong>Administrator</strong><small id="admin-account-email"></small></span>
                </div>
            </div>
        </aside>
        <div class="admin-sidebar-scrim" id="admin-sidebar-scrim" hidden></div>
        <section class="admin-main">
            <header class="admin-topbar">
                <button class="admin-icon-button admin-menu-toggle" id="admin-menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="admin-breadcrumb"><span>Workspace</span><span aria-hidden="true">/</span><strong id="admin-page-title">Dashboard</strong></div>
                <span class="admin-environment"><span></span>Demo data</span>
            </header>
            <main class="admin-content" id="admin-content" tabindex="-1"></main>
        </section>
    </div>
    <div class="admin-modal-backdrop" id="admin-modal" hidden>
        <section class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
            <div class="admin-modal-heading"><div><p class="admin-eyebrow">CATALOG</p><h2 id="admin-modal-title">Add product</h2></div><button class="admin-icon-button" id="admin-modal-close" type="button" aria-label="Close dialog">&times;</button></div>
            <form id="product-form">
                <input type="hidden" name="id">
                <div class="admin-field"><label for="product-name">Product name</label><input id="product-name" name="name" required maxlength="120"></div>
                <div class="admin-field"><label for="product-description">Description</label><textarea id="product-description" name="description" rows="3" maxlength="1200" required></textarea></div>
                <div class="admin-form-grid">
                    <div class="admin-field"><label for="product-price">Price (INR)</label><input id="product-price" name="price" type="number" min="0.01" step="0.01" required></div>
                    <div class="admin-field"><label for="product-category">Category</label><input id="product-category" name="category" required maxlength="60" list="product-categories"><datalist id="product-categories"></datalist></div>
                    <div class="admin-field"><label for="product-stock">Stock quantity</label><input id="product-stock" name="stock" type="number" min="0" step="1" required></div>
                    <div class="admin-field"><label for="product-old-price">Sale / previous price (optional)</label><input id="product-old-price" name="oldPrice" type="number" min="0.01" step="0.01"></div>
                </div>
                <div class="admin-field"><label for="product-image">Image URL</label><input id="product-image" name="image" type="url" placeholder="https://example.com/image.jpg" required></div>
                <p id="product-form-error" class="admin-form-message" role="alert" hidden></p>
                <div class="admin-modal-actions"><button class="admin-button admin-button-secondary" id="admin-modal-cancel" type="button">Cancel</button><button class="admin-button admin-button-primary" type="submit">Save product</button></div>
            </form>
        </section>
    </div>
    <div class="admin-modal-backdrop" id="admin-detail-modal" hidden>
        <section class="admin-modal admin-detail-modal" role="dialog" aria-modal="true" aria-labelledby="admin-detail-title">
            <div class="admin-modal-heading"><div><p class="admin-eyebrow">ORDER DETAILS</p><h2 id="admin-detail-title">Order</h2></div><button class="admin-icon-button" id="admin-detail-close" type="button" aria-label="Close order details">&times;</button></div>
            <div id="admin-detail-content"></div>
        </section>
    </div>
    <div class="admin-toast" id="admin-toast" role="status" aria-live="polite" hidden></div>
    <script src="js/data.js"></script>
    <script src="js/admin-service.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
