<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Aura</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <a href="index.html" class="brand auth-brand">Aura.</a>
        
        <div class="auth-card">
            <h2>Create an Account</h2>
            <p class="auth-subtitle">Join us to get the best shopping experience</p>
            
            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-phone">Phone Number</label>
                    <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 000-0000" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="8">
                    <small style="color: var(--muted); font-size: 0.8rem; margin-top: 4px; display: block;">Must be at least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-confirm">Confirm Password</label>
                    <input type="password" id="reg-confirm" class="form-control" placeholder="••••••••" required minlength="8">
                    <small id="password-error" style="color: var(--danger); font-size: 0.8rem; margin-top: 4px; display: none;">Passwords do not match.</small>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: var(--spacing-md);">Create Account</button>
            </form>
            
            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
