<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Aura</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="brand">Aura.</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="products.html?category=Electronics">Electronics</a>
                <a href="products.html?category=Fashion">Fashion</a>
                <a href="#">Deals</a>
            </nav>
            <div class="nav-icons">
                <a href="products.html" class="icon-btn" aria-label="Search">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </a>
                <a href="cart.html" class="icon-btn" aria-label="Cart">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <span class="cart-count" style="display: none;">0</span>
                </a>
                <a href="login.html" class="icon-btn" id="nav-login" aria-label="User Account">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </a>
                <button class="icon-btn mobile-menu-btn" aria-label="Menu">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb container" id="breadcrumb">
        <!-- Injected via JS -->
    </div>

    <!-- Product Details Section -->
    <main class="container product-details-layout" id="product-container">
        <!-- Content will be injected here via JS -->
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading product...</p>
        </div>
    </main>

    <!-- Related Products -->
    <section class="container" style="margin-top: var(--spacing-xxl); margin-bottom: var(--spacing-xxl);">
        <h2 style="margin-bottom: var(--spacing-lg);">You Might Also Like</h2>
        <div class="related-grid" id="related-products">
            <!-- Injected via JS -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <a href="index.html" class="brand" style="display: block; margin-bottom: var(--spacing-md);">Aura.</a>
                    <p style="color: var(--muted); font-size: 0.9rem;">Elevating your lifestyle with premium products.</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2023 Aura E-Commerce. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/product.js"></script>
</body>
</html>
